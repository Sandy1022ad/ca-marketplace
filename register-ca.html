<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Registration | Join the Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 py-12 px-6">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-lg p-10 border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Expert Onboarding</h1>
        <p class="text-gray-500 mb-8">Join the "Operating System for Modern CAs." We verify all profiles with the ICAI database.</p>

        <form action="#" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">Full Name (as per ICAI)</label>
                    <input type="text" placeholder="e.g. Anjali Sharma" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Membership No. (MRN)</label>
                    <input type="text" placeholder="6-digit Number" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Primary Specialization</label>
                <select class="w-full p-3 rounded-xl border border-gray-200 outline-none bg-white">
                    <option>GST Notice Resolution</option>
                    <option>E-commerce Tax Reconciliation</option>
                    <option>Startup Incorporation</option>
                    <option>Income Tax & TDS</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Upload COP / Identity Proof</label>
                <div class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center hover:bg-gray-50 cursor-pointer">
                    <p class="text-xs text-gray-400">PDF or JPG (Verified via ICAI API)</p>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-800 transition">
                Submit for Verification
            </button>
        </form>
    </div>
</body>
</html>
