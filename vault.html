<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault | CA Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="max-w-2xl mx-auto pt-10 px-6">
        <div class="flex items-center justify-between mb-8">
            <div class="text-center w-1/3"><span class="bg-blue-600 text-white w-8 h-8 rounded-full inline-block leading-8 mb-2">✓</span><p class="text-xs">Payment</p></div>
            <div class="h-1 bg-blue-600 flex-1 mb-6"></div>
            <div class="text-center w-1/3"><span class="bg-blue-600 text-white w-8 h-8 rounded-full inline-block leading-8 mb-2">2</span><p class="text-xs font-bold">Upload Docs</p></div>
            <div class="h-1 bg-gray-300 flex-1 mb-6"></div>
            <div class="text-center w-1/3"><span class="bg-gray-300 text-white w-8 h-8 rounded-full inline-block leading-8 mb-2">3</span><p class="text-xs">Video Call</p></div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
            <h2 class="text-2xl font-bold mb-2">Secure Digital Vault</h2>
            <p class="text-gray-500 mb-8 text-sm">Upload your GST notice or Tally export. Files are encrypted with AES-256 for your safety.</p>

            <div class="border-2 border-dashed border-blue-200 rounded-2xl p-10 text-center bg-blue-50 hover:bg-blue-100 transition cursor-pointer" id="drop-zone">
                <div class="bg-white w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <p class="font-semibold text-blue-700">Click to upload or drag & drop</p>
                <p class="text-xs text-gray-400 mt-1">PDF, PNG, JPG or XLSX (Max 10MB)</p>
                <input type="file" id="file-input" class="hidden">
            </div>

            <div id="file-list" class="mt-6 space-y-3 hidden">
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border">
                    <span class="text-sm font-medium" id="file-name">notice_01.pdf</span>
                    <span class="text-xs text-green-600 font-bold">Encrypted ✓</span>
                </div>
            </div>

            <button id="connect-btn" class="w-full mt-10 bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg opacity-50 cursor-not-allowed transition hover:bg-blue-700">
                Join Video Consultation
            </button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const connectBtn = document.getElementById('connect-btn');
        const fileList = document.getElementById('file-list');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                document.getElementById('file-name').innerText = e.target.files[0].name;
                fileList.classList.remove('hidden');
                connectBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                connectBtn.disabled = false;
            }
        };

        connectBtn.onclick = () => {
            // In a real app, this would link to a unique Zoom/Google Meet/Agora room
            alert("Redirecting to secure video room...");
            window.location.href = "https://meet.google.com/new"; 
        };
    </script>
</body>
</html>
