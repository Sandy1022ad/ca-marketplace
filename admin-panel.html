<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control | CA Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen">

    <aside class="w-64 bg-slate-900 p-6 text-white">
        <div class="text-xl font-extrabold mb-10 tracking-tight text-blue-400">ADMIN HUB</div>
        <nav class="space-y-2">
            <a href="#" class="block bg-slate-800 px-4 py-3 rounded-xl border-l-4 border-blue-500">Approvals</a>
            <a href="#" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">Transactions</a>
            <a href="#" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">User Reports</a>
            <a href="#" class="block px-4 py-3 hover:bg-slate-800 rounded-xl transition">Settings</a>
        </nav>
    </aside>

    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Pending Verifications</h1>
                <p class="text-slate-500">Review and approve CA practitioners for the marketplace.</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white px-4 py-2 rounded-xl shadow-sm border text-sm">
                    <span class="text-slate-400">Total CAs:</span> <span class="font-bold">1,240</span>
                </div>
            </div>
        </header>

        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs font-bold">
                    <tr>
                        <th class="px-6 py-4">Name / MRN</th>
                        <th class="px-6 py-4">Specialization</th>
                        <th class="px-6 py-4">Documents</th>
                        <th class="px-6 py-4">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr>
                        <td class="px-6 py-6">
                            <div class="font-bold text-slate-800">CA Anjali Sharma</div>
                            <div class="text-xs text-blue-600 font-mono">MRN: 123456</div>
                        </td>
                        <td class="px-6 py-6">
                            <span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">GST Notice Expert</span>
                        </td>
                        <td class="px-6 py-6">
                            <button class="text-blue-600 text-sm hover:underline font-medium">View COP.pdf</button>
                        </td>
                        <td class="px-6 py-6 flex gap-2">
                            <button class="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-700">Approve</button>
                            <button class="bg-white border border-red-200 text-red-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-red-50">Reject</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="px-6 py-6">
                            <div class="font-bold text-slate-800">CA Rajesh Kumar</div>
                            <div class="text-xs text-blue-600 font-mono">MRN: 789012</div>
                        </td>
                        <td class="px-6 py-6">
                            <span class="bg-purple-50 text-purple-700 px-3 py-1 rounded-full text-xs font-semibold">E-commerce Tax</span>
                        </td>
                        <td class="px-6 py-6">
                            <button class="text-blue-600 text-sm hover:underline font-medium">View COP.pdf</button>
                        </td>
                        <td class="px-6 py-6 flex gap-2">
                            <button class="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-700">Approve</button>
                            <button class="bg-white border border-red-200 text-red-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-red-50">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
